name: CI

on:
  push:
    branches:
      - main
      - "1.*"
  pull_request:
    branches:
      - main
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）校验推荐 IDE 版本兼容性
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, test and verify
        run: ./gradlew :check :verifyPluginProjectConfiguration --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  compatibility:
    name: IDE Compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify against recommended IDE versions
        run: ./gradlew :verifyPlugin --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verification
          path: build/reports/pluginVerifier/
          retention-days: 14